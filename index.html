<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AwmBagan Na</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);
      padding: 20px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    .header, .card {
      background: white;
      border-radius: 28px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .header {
      text-align: center;
    }

    h1 {
      color: #ff4d6d;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 18px;
    }

    h2 {
      color: #5f27cd;
      margin-bottom: 15px;
    }

    input, button {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid #ddd;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #ff4d6d, #ff9f43);
    }

    button:hover {
      transform: scale(1.02);
    }

    .trip-display {
      margin-top: 15px;
      font-size: 26px;
      font-weight: bold;
      color: #333;
    }

    .friend {
      display: inline-block;
      background: #eef2ff;
      color: #5f27cd;
      padding: 10px 16px;
      border-radius: 30px;
      margin: 6px;
      font-weight: bold;
    }

    .expense {
      background: #f8f9ff;
      border-left: 7px solid #ff9f43;
      padding: 18px;
      border-radius: 20px;
      margin-top: 12px;
    }

    .expense h3 {
      color: #ff4d6d;
      margin-bottom: 6px;
    }

    .summary {
      background: #e8fff1;
      border-left: 7px solid #10ac84;
      padding: 18px;
      border-radius: 20px;
      margin-top: 15px;
    }

    .owe {
      background: #fff4df;
      border-left: 7px solid #feca57;
      padding: 18px;
      border-radius: 20px;
      margin-top: 12px;
      font-size: 17px;
    }

    .small-note {
      color: #777;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🌴 AwmBagan Na! </h1>
      <p class="subtitle"> by ClaireD and ChatG</p>

      <input type="text" id="tripName" placeholder="Enter Trip Name" />
      <div class="trip-display" id="tripDisplay"></div>
    </div>

    <div class="card">
      <h2>👥 Add Friends</h2>
      <input type="text" id="friendName" placeholder="Enter friend name" />
      <button onclick="addFriend()">Add Friend</button>
      <div id="friendList"></div>
    </div>

    <div class="card">
      <h2>💸 Add Expense</h2>
      <input type="text" id="payer" placeholder="Who paid? Example: Claire" />
      <input type="number" id="amount" placeholder="Amount paid" />
      <input type="text" id="description" placeholder="Description: Hotel, food, boat fare..." />
      <button onclick="addExpense()">Add Expense</button>
      <p class="small-note">Tip: the payer name should match one of the friends’ names.</p>
    </div>

    <div class="card">
      <h2>📋 All Expenses</h2>
      <div id="expenseList"></div>
    </div>

    <div class="card">
  <h2>🧮 Final Split</h2>
  <button onclick="calculateSplit()">Calculate Who Owes Who</button>
  <button onclick="resetTrip()" style="background:#ff4757;">Start New Trip</button>
  <div id="result"></div>
</div>
  </div>

  <script>
    let friends = [];
    let expenses = [];

    document.getElementById("tripName").addEventListener("input", function() {
      let trip = this.value.trim();
      document.getElementById("tripDisplay").innerHTML = trip ? "✈️ " + trip : "";
    });

    function addFriend() {
      let name = document.getElementById("friendName").value.trim();

      if (name === "") {
        alert("Enter a friend name.");
        return;
      }

      friends.push(name);
      document.getElementById("friendName").value = "";
      updateFriends();
    }

    function updateFriends() {
      let html = "";

      friends.forEach(friend => {
        html += `<div class="friend">👤 ${friend}</div>`;
      });

      document.getElementById("friendList").innerHTML = html;
    }

    function addExpense() {
      let payer = document.getElementById("payer").value.trim();
      let amount = parseFloat(document.getElementById("amount").value);
      let description = document.getElementById("description").value.trim();

      if (friends.length === 0) {
        alert("Add friends first.");
        return;
      }

      if (payer === "") {
        alert("Enter who paid.");
        return;
      }

      if (isNaN(amount) || amount <= 0) {
        alert("Enter a valid amount.");
        return;
      }

      expenses.push({
        payer: payer,
        amount: amount,
        description: description || "Expense"
      });

      document.getElementById("payer").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("description").value = "";

      updateExpenses();
    }

    function updateExpenses() {
      let html = "";

      expenses.forEach((expense, index) => {
        html += `
          <div class="expense">
            <h3>Expense #${index + 1}</h3>
            <p>💸 <strong>${expense.payer}</strong> paid <strong>₱${expense.amount.toFixed(2)}</strong></p>
            <p>📝 ${expense.description}</p>
          </div>
        `;
      });

      document.getElementById("expenseList").innerHTML = html;
    }

    function calculateSplit() {
      if (friends.length === 0 || expenses.length === 0) {
        alert("Add friends and expenses first.");
        return;
      }

      let total = 0;

      expenses.forEach(expense => {
        total += expense.amount;
      });

      let share = total / friends.length;

      let balances = {};

      friends.forEach(friend => {
        balances[friend] = 0;
      });

      expenses.forEach(expense => {
        if (balances[expense.payer] === undefined) {
          balances[expense.payer] = 0;
        }

        balances[expense.payer] += expense.amount;
      });

      friends.forEach(friend => {
        balances[friend] -= share;
      });

      let debtors = [];
      let creditors = [];

      for (let person in balances) {
        if (balances[person] < -0.01) {
          debtors.push({
            name: person,
            amount: Math.abs(balances[person])
          });
        }

        if (balances[person] > 0.01) {
          creditors.push({
            name: person,
            amount: balances[person]
          });
        }
      }

      let html = `
        <div class="summary">
          <h3>Trip Summary</h3>
          <p>Total Expenses: <strong>₱${total.toFixed(2)}</strong></p>
          <p>Each Person's Share: <strong>₱${share.toFixed(2)}</strong></p>
        </div>
      `;

      html += `<h3 style="margin-top:20px; color:#5f27cd;">Who Owes Who?</h3>`;

      debtors.forEach(debtor => {
        creditors.forEach(creditor => {
          if (debtor.amount > 0.01 && creditor.amount > 0.01) {
            let payment = Math.min(debtor.amount, creditor.amount);

            html += `
              <div class="owe">
                💸 <strong>${debtor.name}</strong> owes 
                <strong>${creditor.name}</strong> 
                <strong>₱${payment.toFixed(2)}</strong>
              </div>
            `;

            debtor.amount -= payment;
            creditor.amount -= payment;
          }
        });
      });

      document.getElementById("result").innerHTML = html;
    }
  </script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPKmuI0SwDmV9CGREIzW1Qw65M1-2z0bo",
    authDomain: "awmbagan-na.firebaseapp.com",
    databaseURL: "https://awmbagan-na-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "awmbagan-na",
    storageBucket: "awmbagan-na.firebasestorage.app",
    messagingSenderId: "155801535791",
    appId: "1:155801535791:web:f317add0d4ce70c387cdda"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const tripRef = ref(db, "trips/mainTrip");

  let friends = [];
  let expenses = [];

  document.getElementById("tripName").addEventListener("input", function () {
    set(ref(db, "trips/mainTrip/tripName"), this.value);
  });

  window.addFriend = function () {
    let name = document.getElementById("friendName").value.trim();

    if (name === "") {
      alert("Enter friend name.");
      return;
    }

    push(ref(db, "trips/mainTrip/friends"), name);
    document.getElementById("friendName").value = "";
  };

  window.addExpense = function () {
    let payer = document.getElementById("payer").value.trim();
    let amount = parseFloat(document.getElementById("amount").value);
    let description = document.getElementById("description").value.trim();

    if (payer === "") {
      alert("Enter who paid.");
      return;
    }

    if (isNaN(amount) || amount <= 0) {
      alert("Enter valid amount.");
      return;
    }

    push(ref(db, "trips/mainTrip/expenses"), {
      payer: payer,
      amount: amount,
      description: description || "Expense"
    });

    document.getElementById("payer").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("description").value = "";
  };

  onValue(tripRef, function (snapshot) {
    const data = snapshot.val() || {};

    document.getElementById("tripDisplay").innerHTML =
      data.tripName ? "✈️ " + data.tripName : "";

    friends = data.friends
      ? Object.entries(data.friends).map(([id, name]) => ({ id, name }))
      : [];

    expenses = data.expenses
      ? Object.entries(data.expenses).map(([id, expense]) => ({ id, ...expense }))
      : [];

    updateFriends();
    updateExpenses();
    calculateSplit();
  });

  function updateFriends() {
    let html = "";

    friends.forEach(friend => {
      html += `<div class="friend">👤 ${friend.name}</div>`;
    });

    document.getElementById("friendList").innerHTML = html;
  }

  function updateExpenses() {
    let html = "";

    expenses.forEach((expense, index) => {
      html += `
        <div class="expense">
          <h3>Expense #${index + 1}</h3>
          <p>💸 <strong>${expense.payer}</strong> paid <strong>₱${Number(expense.amount).toFixed(2)}</strong></p>
          <p>📝 ${expense.description}</p>

          <button onclick="editExpense('${expense.id}')">
            Edit Expense
          </button>

          <button onclick="deleteExpense('${expense.id}')" style="background:#ff4757;">
            Delete Expense
          </button>
        </div>
      `;
    });

    document.getElementById("expenseList").innerHTML = html;
  }

  window.editExpense = function (id) {
    let expense = expenses.find(exp => exp.id === id);

    if (!expense) return;

    let newPayer = prompt("Who paid?", expense.payer);
    let newAmount = prompt("Amount paid?", expense.amount);
    let newDescription = prompt("Description?", expense.description);

    if (newPayer === null || newAmount === null || newDescription === null) {
      return;
    }

    newAmount = parseFloat(newAmount);

    if (newPayer.trim() === "") {
      alert("Payer cannot be empty.");
      return;
    }

    if (isNaN(newAmount) || newAmount <= 0) {
      alert("Enter a valid amount.");
      return;
    }

    update(ref(db, "trips/mainTrip/expenses/" + id), {
      payer: newPayer.trim(),
      amount: newAmount,
      description: newDescription.trim() || "Expense"
    });
  };

  window.deleteExpense = function (id) {
    let confirmDelete = confirm("Delete this expense?");

    if (!confirmDelete) return;

    remove(ref(db, "trips/mainTrip/expenses/" + id));
  };

  window.resetTrip = function () {
    let confirmReset = confirm("Start a new trip? This will delete all friends and expenses.");

    if (!confirmReset) return;

    remove(ref(db, "trips/mainTrip"));

    document.getElementById("tripName").value = "";
    document.getElementById("tripDisplay").innerHTML = "";
    document.getElementById("friendName").value = "";
    document.getElementById("payer").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("description").value = "";
  };

  window.calculateSplit = function () {
    if (friends.length === 0 || expenses.length === 0) {
      document.getElementById("result").innerHTML = "";
      return;
    }

    let friendNames = friends.map(friend => friend.name);

    let total = expenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
    let share = total / friendNames.length;

    let balances = {};

    friendNames.forEach(friend => {
      balances[friend] = 0;
    });

    expenses.forEach(expense => {
      if (balances[expense.payer] === undefined) {
        balances[expense.payer] = 0;
      }

      balances[expense.payer] += Number(expense.amount);
    });

    friendNames.forEach(friend => {
      balances[friend] -= share;
    });

    let debtors = [];
    let creditors = [];

    for (let person in balances) {
      if (balances[person] < -0.01) {
        debtors.push({ name: person, amount: Math.abs(balances[person]) });
      }

      if (balances[person] > 0.01) {
        creditors.push({ name: person, amount: balances[person] });
      }
    }

    let html = `
      <div class="summary">
        <h3>Trip Summary</h3>
        <p>Total Expenses: <strong>₱${total.toFixed(2)}</strong></p>
        <p>Each Person's Share: <strong>₱${share.toFixed(2)}</strong></p>
      </div>
    `;

    html += `<h3 style="margin-top:20px; color:#5f27cd;">Who Owes Who?</h3>`;

    debtors.forEach(debtor => {
      creditors.forEach(creditor => {
        if (debtor.amount > 0.01 && creditor.amount > 0.01) {
          let payment = Math.min(debtor.amount, creditor.amount);

          html += `
            <div class="owe">
              💸 <strong>${debtor.name}</strong> owes 
              <strong>${creditor.name}</strong> 
              <strong>₱${payment.toFixed(2)}</strong>
            </div>
          `;

          debtor.amount -= payment;
          creditor.amount -= payment;
        }
      });
    });

    document.getElementById("result").innerHTML = html;
  };
</script>
</body>
</html>
