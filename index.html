<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmbagMate</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#667eea,#764ba2,#ff758c);
      min-height:100vh;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .header{
      background:white;
      padding:25px;
      border-radius:25px;
      margin-bottom:20px;
      text-align:center;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .header h1{
      color:#ff4d6d;
      font-size:42px;
    }

    .header p{
      color:#666;
      margin-top:8px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:25px;
      margin-bottom:20px;
      box-shadow:0 8px 20px rgba(0,0,0,0.12);
    }

    h2{
      color:#5f27cd;
      margin-bottom:15px;
    }

    input, select{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #ddd;
      margin-top:10px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      margin-top:15px;
      background:linear-gradient(135deg,#ff4d6d,#ff9f43);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.02);
    }

    .friends{
      margin-top:15px;
    }

    .friend{
      display:inline-block;
      background:#eef2ff;
      color:#5f27cd;
      padding:10px 16px;
      border-radius:30px;
      margin:5px;
      font-weight:bold;
    }

    .expense{
      background:#f8f9ff;
      border-left:6px solid #ff9f43;
      padding:18px;
      border-radius:18px;
      margin-top:12px;
    }

    .expense h3{
      color:#ff4d6d;
      margin-bottom:5px;
    }

    .summary{
      background:#e8fff1;
      border-left:6px solid #10ac84;
      padding:18px;
      border-radius:18px;
      margin-top:15px;
      font-weight:bold;
    }

    .owe{
      background:#fff4df;
      border-left:6px solid #feca57;
      padding:18px;
      border-radius:18px;
      margin-top:12px;
    }

    .trip-name{
      font-size:28px;
      color:#222;
      margin-top:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🌴 AmbagMate</h1>
    <p>No more “kinsa akong bayran?” moments.</p>

    <input type="text" id="tripName" placeholder="Enter Trip Name">
    <div class="trip-name" id="tripDisplay"></div>
  </div>

  <div class="card">
    <h2>👥 Add Friends</h2>

    <input type="text" id="friendName" placeholder="Enter friend name">

    <button onclick="addFriend()">Add Friend</button>

    <div class="friends" id="friendList"></div>
  </div>

  <div class="card">
    <h2>💸 Add Expense</h2>

    <select id="payer"></select>

    <input type="number" id="amount" placeholder="Amount Paid">

    <input type="text" id="description" placeholder="Description">

    <button onclick="addExpense()">Add Expense</button>
  </div>

  <div class="card">
    <h2>📋 All Expenses</h2>

    <div id="expenseList"></div>
  </div>

  <div class="card">
    <h2>🧮 Final Split</h2>

    <button onclick="calculateSplit()">
      Calculate Split
    </button>

    <div id="result"></div>
  </div>

</div>

<script>

let friends = [];
let expenses = [];

document.getElementById("tripName").addEventListener("input", function(){
  document.getElementById("tripDisplay").innerHTML =
    "✈️ " + this.value;
});

function addFriend(){

  let name =
    document.getElementById("friendName").value.trim();

  if(name === ""){
    alert("Enter a name");
    return;
  }

  friends.push(name);

  document.getElementById("friendName").value = "";

  updateFriends();
  updateDropdown();
}

function updateFriends(){

  let html = "";

  friends.forEach(friend => {
    html += `
      <div class="friend">
        👤 ${friend}
      </div>
    `;
  });

  document.getElementById("friendList").innerHTML = html;
}

function updateDropdown(){

  let dropdown =
    document.getElementById("payer");

  dropdown.innerHTML = "";

  friends.forEach(friend => {
    dropdown.innerHTML += `
      <option value="${friend}">
        ${friend}
      </option>
    `;
  });
}

function addExpense(){

  let payer =
    document.getElementById("payer").value;

  let amount =
    parseFloat(document.getElementById("amount").value);

  let description =
    document.getElementById("description").value;

  if(isNaN(amount) || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  expenses.push({
    payer,
    amount,
    description
  });

  document.getElementById("amount").value = "";
  document.getElementById("description").value = "";

  updateExpenses();
}

function updateExpenses(){

  let html = "";

  expenses.forEach((expense,index)=>{

    html += `
      <div class="expense">
        <h3>Expense #${index+1}</h3>

        <p><strong>${expense.payer}</strong>
        paid <strong>₱${expense.amount.toFixed(2)}</strong></p>

        <p>${expense.description}</p>
      </div>
    `;
  });

  document.getElementById("expenseList").innerHTML = html;
}

function calculateSplit(){

  let total = 0;

  expenses.forEach(expense=>{
    total += expense.amount;
  });

  let share = total / friends.length;

  let balances = {};

  friends.forEach(friend=>{
    balances[friend] = -share;
  });

  expenses.forEach(expense=>{
    balances[expense.payer] += expense.amount;
  });

  let debtors = [];
  let creditors = [];

  for(let person in balances){

    if(balances[person] < 0){
      debtors.push({
        name: person,
        amount: -balances[person]
      });
    }

    else if(balances[person] > 0){
      creditors.push({
        name: person,
        amount: balances[person]
      });
    }
  }

  let html = `
    <div class="summary">
      Total Expenses: ₱${total.toFixed(2)}<br>
      Each Person Should Pay: ₱${share.toFixed(2)}
    </div>
  `;

  debtors.forEach(debtor=>{

    creditors.forEach(creditor=>{

      if(debtor.amount > 0 && creditor.amount > 0){

        let payment =
          Math.min(debtor.amount, creditor.amount);

        html += `
          <div class="owe">
            💸 ${debtor.name} owes
            ${creditor.name}

            <strong>
              ₱${payment.toFixed(2)}
            </strong>
          </div>
        `;

        debtor.amount -= payment;
        creditor.amount -= payment;
      }
    });
  });

  document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
